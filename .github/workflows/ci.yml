name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test
          colcon test-result --verbose
  simulation:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo
        run: apt-get update && apt-get install -y ros-jazzy-ros-gz
      - name: Run simulation gate
        run: ./scripts/sim_gate.sh
  docker-build:
    runs-on: ubuntu-24.04
    needs: simulation
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 -t ros2-sre-pipeline:arm64 .
      - name: Push image
        if: github.event_name == 'push'
        run: docker buildx build --platform linux/arm64 -t ghcr.io/dario-garzon/ros2-sre-pipeline:${{ github.sha }} --push .
  publish-desired-image:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
      - name: Point deploy branch at the new image
        run: |
          echo "ghcr.io/dario-garzon/ros2-sre-pipeline:${{ github.sha }}" > desired-image
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desired-image
          git commit -m "deploy: pin image to ${{ github.sha }}"
          git push