name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test
          colcon test-result --verbose
  docker-build:
    runs-on: ubuntu-24.04
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 -t ros2-sre-pipeline:arm64 .
      - name: Push image
        if: github.event_name == 'push'
        run: docker buildx build --platform linux/arm64 -t ghcr.io/dario-garzon/ros2-sre-pipeline:${{ github.sha }} --push .